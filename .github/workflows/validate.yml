name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: arduino/setup-task@v3.0.0
      # ShellCheck intentionally floats to test compatibility with Ubuntu's current stable package.
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: npm install --global @anthropic-ai/claude-code@2.1.220
      - run: uv sync --locked
      - run: task validate
